[build]
  command = "npm ci --prefix backend && npm ci --prefix frontend && npm run build"
  publish = "frontend/dist"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "4000,development,http://localhost:5173,http://localhost:4000"
  SECRETS_SCAN_OMIT_KEYS = "PORT,FRONTEND_ORIGIN,NODE_ENV"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200